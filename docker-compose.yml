name: ai-mirror

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-mirror-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/ai_mirror.db
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-ai_mirror_local}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_BASE_URL=${XAI_BASE_URL:-https://api.x.ai/v1}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      # Disable Chroma anonymous telemetry to silence posthog noise.
      - ANONYMIZED_TELEMETRY=False
      - CHROMA_TELEMETRY_DISABLED=true
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
    volumes:
      - ./backend/data:/app/data
      - ./backend/app:/app/app
    # Neo4j is opt-in (see `profiles: ["neo4j"]` below). The KG service has
    # a SQLite triple-store fallback that does the real work, so removing
    # the hard dependency frees ~975 MB of RAM by default.
    mem_limit: 1g
    networks:
      - ai-mirror-net

  # Optional Neo4j. Enable with: docker compose --profile neo4j up
  # The browser UI is at http://localhost:7474. The backend will auto-mirror
  # KG triples to it when reachable, otherwise everything stays in SQLite.
  neo4j:
    image: neo4j:5-community
    container_name: ai-mirror-neo4j
    restart: unless-stopped
    profiles: ["neo4j"]
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-ai_mirror_local}
      # Tighter heap so the optional container stays under ~400 MB total.
      - NEO4J_server_memory_heap_initial__size=128m
      - NEO4J_server_memory_heap_max__size=256m
      - NEO4J_PLUGINS=["apoc"]
    mem_limit: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-mirror-net

  # Optional local LLM. Enable with: docker compose --profile local-llm up
  ollama:
    image: ollama/ollama:latest
    container_name: ai-mirror-ollama
    restart: unless-stopped
    profiles: ["local-llm"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ai-mirror-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-mirror-frontend
    restart: unless-stopped
    profiles: ["frontend"]
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - ai-mirror-net

networks:
  ai-mirror-net:
    driver: bridge

volumes:
  neo4j-data:
  neo4j-logs:
  ollama-data:
